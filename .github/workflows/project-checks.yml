name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.1
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          echo 'cecd0cb6b55e931318a9d7237dc4197d69ea914966787a454808523626e2789f  /tmp/godot.zip' | sha256sum --check
          unzip /tmp/godot.zip -d /tmp/godot
      - name: Validate data and run physics regressions
        run: python3 tools/verify_project.py --godot /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
